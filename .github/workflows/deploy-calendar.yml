name: Deploy calendar feeds

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-calendar.yml
      - calendar-site/**
      - conference/**
      - conference-yaml-schema.yml
      - extensions/cli/**
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: calendar-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out fork
        uses: actions/checkout@v7

      - name: Refresh conference data from upstream
        run: |
          git remote add upstream https://github.com/ccfddl/ccf-deadlines.git
          git fetch --depth=1 upstream main
          git checkout upstream/main -- conference

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: extensions/cli/pyproject.toml

      - name: Install calendar generator
        run: python -m pip install ./extensions/cli

      - name: Generate calendar feeds
        run: python extensions/cli/ccfddl/convert_to_ical.py

      - name: Assemble Pages artifact
        run: |
          mkdir -p _site/conference
          mv ./*.ics _site/conference/
          cp -R calendar-site/. _site/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
